<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISE — Intelligent Search Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="particleCanvas"></canvas>

    <div class="search-page">

      <!-- Logo -->
      <header class="site-header">
        <div class="site-logo">ISE</div>
        <p class="site-tagline">Intelligent Movie Search Engine &mdash; powered by Groq AI &amp; TMDB</p>
      </header>

      <!-- Tabs -->
      <nav class="tabs" role="tablist">
        <button class="tab tab--active" id="tabSql" role="tab" aria-selected="true">🎬 Movie Search</button>
        <button class="tab" id="tabSemantic" role="tab" aria-selected="false">🔍 Describe &amp; Find</button>
      </nav>

      <!-- ── Movie Search pane ──────────────────────────────────────── -->
      <main id="paneSql" role="tabpanel">

        <div class="searchbox-wrap">
          <!-- Main search bar -->
          <div class="searchbox">
            <span class="searchbox__icon">🎬</span>
            <div class="searchbox__genre-wrap">
              <select id="filterGenre">
                <option value="">Any genre</option>
                <option value="action">Action</option>
                <option value="adventure">Adventure</option>
                <option value="animation">Animation</option>
                <option value="comedy">Comedy</option>
                <option value="crime">Crime</option>
                <option value="documentary">Documentary</option>
                <option value="drama">Drama</option>
                <option value="family">Family</option>
                <option value="fantasy">Fantasy</option>
                <option value="history">History</option>
                <option value="horror">Horror</option>
                <option value="music">Music</option>
                <option value="mystery">Mystery</option>
                <option value="romance">Romance</option>
                <option value="science fiction">Sci-Fi</option>
                <option value="thriller">Thriller</option>
                <option value="war">War</option>
                <option value="western">Western</option>
              </select>
            </div>
            <button id="runBtn" class="searchbox__btn" type="button">Search</button>
          </div>

          <!-- Filter row -->
          <div class="filter-row">
            <div class="filter-item">
              <label class="filter-item__label">📅 Year</label>
              <div class="filter-item__inputs">
                <input id="filterYearFrom" type="text" inputmode="numeric" maxlength="4" placeholder="From" />
                <span class="range-sep">–</span>
                <input id="filterYearTo" type="text" inputmode="numeric" maxlength="4" placeholder="To" />
              </div>
            </div>

            <div class="filter-item filter-item--rating">
              <label class="filter-item__label">⭐ Min rating <span id="ratingValue" class="rating-chip">any</span></label>
              <input id="filterRating" type="range" min="0" max="9" step="0.5" value="0" />
            </div>

            <div class="filter-item">
              <label class="filter-item__label">↕ Sort by</label>
              <div class="select-wrap">
                <select id="filterSort">
                  <option value="popular">Most Popular</option>
                  <option value="rating">Highest Rated</option>
                  <option value="newest">Newest First</option>
                  <option value="oldest">Oldest First</option>
                  <option value="revenue">Box Office</option>
                </select>
              </div>
            </div>
          </div>

          <div class="search-meta">
            <button id="clearBtn" type="button" class="btn--clear" hidden>Clear</button>
            <span class="status" id="statusText">Ready</span>
          </div>
        </div>

        <!-- Results -->
        <section class="results-section">
          <div id="sqlCards" class="movie-grid"></div>
          <div class="load-more-wrap">
            <button id="loadMoreBtn" type="button" class="btn--load-more" hidden>Load more</button>
          </div>
        </section>

      </main>

      <!-- ── Describe & Find pane ───────────────────────────────────── -->
      <main id="paneSemantic" role="tabpanel" hidden>

        <div class="searchbox-wrap">
          <div class="searchbox searchbox--semantic">
            <textarea
              id="semanticInput"
              rows="1"
              placeholder="Describe a movie... e.g. toys that come to life when humans aren't watching"
            ></textarea>
            <button id="semanticBtn" class="searchbox__btn" type="button">Find</button>
          </div>
          <div class="search-meta">
            <button id="semanticClearBtn" type="button" class="btn--clear" hidden>Clear</button>
            <span class="status" id="semanticStatus">Ready</span>
          </div>
        </div>

        <!-- Results -->
        <section class="results-section">
          <div id="semanticCards" class="movie-grid"></div>
          <div class="load-more-wrap">
            <button id="semanticLoadMoreBtn" type="button" class="btn--load-more" hidden>Load more</button>
          </div>
        </section>

      </main>

    </div><!-- /.search-page -->

    <!-- Movie detail modal -->
    <div id="movieModal" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal">
        <button class="modal__close" id="modalClose" aria-label="Close">&times;</button>
        <div class="modal__inner"></div>
      </div>
    </div>

    <script src="./app.js?v=11"></script>
  </body>
</html>
